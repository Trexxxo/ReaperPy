name: Verify context menu translation
on:
  push:
    branches: [fix/english-ue-context-menu]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v tests.test_tools_common_menu_i18n tests.test_tools_i18n tests.test_ue_quick tests.test_gui_discover
